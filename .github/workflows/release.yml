name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag name; must match package.json (e.g. v0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable, EXE installer, and MSI installer
        run: npm run build:release

      - name: Determine version tag
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          $expected = "v$(node -p "require('./package.json').version")"
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME } elseif ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { $expected }
          if ($tag -ne $expected) { throw "Release tag $tag does not match package version $expected" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          @(
            "dist-release/CodexSwitcher-$version-portable-x64.exe",
            "dist-release/CodexSwitcher-$version-setup-x64.exe",
            "dist-release/CodexSwitcher-$version-setup-x64.msi"
          ) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing release asset: $_" }
            Get-Item -LiteralPath $_ | Select-Object Name, Length
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Codex Switcher ${{ steps.version.outputs.tag }}
          files: |
            dist-release/CodexSwitcher-*-portable-x64.exe
            dist-release/CodexSwitcher-*-setup-x64.exe
            dist-release/CodexSwitcher-*-setup-x64.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
