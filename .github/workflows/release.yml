name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            bundles: nsis,msi
          - id: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - id: macos-arm64
            os: macos-15
            bundles: dmg
          - id: macos-x64
            os: macos-15-intel
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must match package version $expected"; exit 1; }
      - run: npm ci
      - name: Build Tauri bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/codexswitcher.exe -Destination "release-assets/CodexSwitcher-$version-portable-x64.exe"
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi -Filter '*.msi' -File | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw 'Windows installer artifact missing' }
          Copy-Item -LiteralPath $nsis.FullName -Destination "release-assets/CodexSwitcher-$version-setup-x64.exe"
          Copy-Item -LiteralPath $msi.FullName -Destination "release-assets/CodexSwitcher-$version-setup-x64.msi"
      - name: Stage Linux and macOS artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          if [ "$RUNNER_OS" = Linux ]; then
            cp src-tauri/target/release/bundle/deb/*.deb release-assets/
            cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          else
            version=$(node -p "require('./package.json').version")
            dmg=(src-tauri/target/release/bundle/dmg/*.dmg)
            test "${#dmg[@]}" -eq 1
            cp "${dmg[0]}" "release-assets/CodexSwitcher-${version}-${{ matrix.id }}.dmg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.id }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release description
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-notes.cjs --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --assets release-assets --output release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Codex Switcher ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
